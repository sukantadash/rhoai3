apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-benchmark
  namespace: demo-llm
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: test-user
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm@sha256:e3ad2371bfa8e42f2c3d1251b62d0d9c9706c27ae2143c8c048eb5fc6aebb558
        env:
          # Update REPLACE_WITH_CLUSTER_APPS_DOMAIN, LLM_URL path, and LLM_MODEL before applying (see llmd-script.sh).
          - name: LLM_URL
            value: "https://inference-gateway.REPLACE_WITH_CLUSTER_APPS_DOMAIN/demo-llm/qwen"
          - name: LLM_MODEL
            value: "Qwen/Qwen3-0.6B"
          - name: HF_HOME
            value: /tmp/hf-cache
          - name: TRANSFORMERS_CACHE
            value: /tmp/hf-cache
          - name: XDG_CACHE_HOME
            value: /tmp
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -euo pipefail
            TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            exec guidellm run \
              --backend "kind=openai_http,target=${LLM_URL},model=${LLM_MODEL},api_key=${TOKEN}" \
              --data '{"kind":"synthetic_text","prompt_tokens":100,"output_tokens":50,"prefix_buckets":[{"bucket_weight":100,"prefix_count":20,"prefix_tokens":2048}]}' \
              --profile "kind=throughput,max_concurrency=20" \
              --constraint "kind=max_duration,seconds=60" \
              --tokenizer "kind=huggingface_auto,model=${LLM_MODEL}" \
              --output "kind=json,path=/results/benchmark.json" \
              --output "kind=csv,path=/results/benchmark.csv"
        volumeMounts:
          - name: cache
            mountPath: /tmp/hf-cache
          - name: results
            mountPath: /results
      volumes:
        - name: cache
          emptyDir: {}
        - name: results
          emptyDir: {}
